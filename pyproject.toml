[project]
name = "forever-craft"
version = "0.1.0"
description = "WoW Forever: себестоимость и выгода крафта по ценам аукциона"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "uvicorn>=0.32",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
