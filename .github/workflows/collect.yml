name: collect

# Сбор цен аукциона, обновление рецептов и пересчёт таблиц калькулятора.
# GitHub может запускать cron с опозданием на 5–15 минут; после 60 дней без коммитов расписание
# отключается — включить обратно: Actions → collect → Enable workflow.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force_recipes:
        description: "Перекачать рецепты, даже если версия выгрузки не изменилась"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run job
        env:
          BLIZZ_CLIENT_ID: ${{ secrets.BLIZZ_CLIENT_ID }}
          BLIZZ_CLIENT_SECRET: ${{ secrets.BLIZZ_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CACHE_DIR: ${{ runner.temp }}
        run: python -m app.job ${{ inputs.force_recipes && '--force-recipes' || '' }}
